{{ define "main" }}
<div class="container">
  <div class="content-section">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </div>

  {{ if .Pages }}
  <div class="content-section">
    <div class="card-grid">
      {{ range .Pages }}
      <div class="card">
        <h3><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
        {{ .Summary }}
      </div>
      {{ end }}
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
